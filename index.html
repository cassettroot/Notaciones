<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador y Conversor de Notaciones</title>
    <link rel="stylesheet" href="public/css/b5.css">
    <link rel="stylesheet" href="public/css/main.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h3 class="text-center mb-4">Validador de Notaciones</h3>

                    <div class="mb-3">
                        <label for="expresion" class="form-label">Ingresa la expresión:</label>
                        <input type="text" id="expresion" class="form-control" placeholder="Ej: (A+B)*C  |  A B + C *  |  * + A B C">
                    </div>

                    <div class="d-flex gap-2 mb-3">
                        <button id="btn-validar" class="btn btn-primary w-100">Validar y Convertir</button>
                        <button id="btn-limpiar" class="btn btn-secondary w-50">Limpiar</button>
                    </div>

                    <div id="resultado" class="alert d-none text-center fs-5 mb-3"></div>

                    <div id="panel-conversiones" class="card bg-light border d-none">
                        <div class="card-body">
                            <h6 class="text-muted mb-3">Representación en cada notación:</h6>
                            <div class="mb-2">
                                <strong>Infija:</strong>
                                <div id="res-infija" class="font-monospace text-primary bg-white p-2 rounded border mt-1"></div>
                            </div>
                            <div class="mb-2">
                                <strong>Prefija:</strong>
                                <div id="res-prefija" class="font-monospace text-success bg-white p-2 rounded border mt-1"></div>
                            </div>
                            <div>
                                <strong>Postfija:</strong>
                                <div id="res-postfija" class="font-monospace text-dark bg-white p-2 rounded border mt-1"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="public/js/index.js"></script>
</body>
</html>
